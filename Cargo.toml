[package]
name = "compagnon"
version = "0.12.0"
edition = "2024"
rust-version = "1.91"
description = "Plateforme de personnages conversationnels sur Telegram"
license = "UNLICENSED"
publish = false

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
# Les features sont ajoutées phase par phase, pas d'avance : « multipart » arrivera avec
# l'envoi de photos (phase 3), pas avant. Une feature inutilisée est du code compilé dans le
# binaire que personne n'a relu.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# sha2 : empreinte du prompt système généré, pour détecter un écart introduit hors du processus
# — une console psql, une restauration partielle. DÉJÀ dans l'arbre via sqlx-core (authentification
# SCRAM) : le déclarer en dépendance directe n'ajoute rien au binaire, c'est la même caisse à la
# même version.
sha2 = "0.10.9"
# PostgreSQL. Trois choix explicites dans cette liste de features :
#
# « tls-rustls-aws-lc-rs » et non natif : la base peut être ailleurs que sur la machine du
# service, et le projet n'embarque qu'une seule pile cryptographique — la même que reqwest.
#
# « uuid » et « chrono » : le schéma repose sur `uuid` et `timestamptz`, et les décoder à la
# main depuis des chaînes annulerait ce que les types de la base garantissent.
#
# « macros » est nécessaire pour `sqlx::migrate!`, qui embarque les migrations dans le binaire
# en lisant le dossier à la compilation. Ce n'est PAS la vérification de requêtes à la
# compilation : celle-ci ne s'active qu'en écrivant `query!` plutôt que `query`, et c'est elle
# qui exigerait une base vivante ou un cache `.sqlx` commité — donc qui casserait la
# construction de l'image Docker. Ce projet écrit donc `sqlx::query` partout, et reporte la
# vérification sur des tests qui tournent contre un vrai PostgreSQL.
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "uuid", "chrono",
    # Les curseurs sont des `numeric(3,2)`, choisis pour que 0,37 soit exactement 0,37 — les
    # décoder en `f64` réintroduirait, dans le code, l'imprécision que le schéma refuse.
    "rust_decimal",
] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
rust_decimal = { version = "1.38", default-features = false, features = ["std"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["trace", "timeout", "limit", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[features]
# Expose `compagnon::fixtures` aux tests d'intégration, qui vivent dans une autre cible de
# compilation que `src/` et ne peuvent donc pas atteindre un module `#[cfg(test)]`. Absente
# du binaire livré.
fixtures = []

[dev-dependencies]
# Dépendance de la caisse sur elle-même : le seul moyen d'activer une caractéristique
# uniquement pour les tests d'intégration. Motif courant, et sans effet sur le binaire.
compagnon = { path = ".", features = ["fixtures"] }
# wiremock : l'API Telegram simulée à la frontière HTTP sortante. C'est le seul élément
# simulé du harnais — le routeur, le webhook et le client sont les vrais.
wiremock = "0.6.5"

[[bin]]
name = "compagnon"
path = "src/main.rs"

# Le mode release sert en production ET aux tests qui touchent à l'asynchrone : le mode debug
# masque des courses que le release révèle.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
